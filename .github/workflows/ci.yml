name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # PHP extensions Mautic and its dependencies need
  PHP_EXTENSIONS: bcmath, curl, gd, imap, intl, mbstring, pdo_mysql, sockets, zip

jobs:
  validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock

  lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > lint.log || { grep -v '^No syntax errors' lint.log; exit 1; }
          echo "$(grep -c '^No syntax errors' lint.log) files OK"

  tests:
    name: PHPUnit and PHPStan (Mautic ${{ matrix.mautic }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # lowest and highest PHP of each supported Mautic line
          - { mautic: '5.0.*', php: '8.0' }
          - { mautic: '^5.2', php: '8.1' }
          - { mautic: '^6.0', php: '8.1' }
          - { mautic: '^6.0', php: '8.3' }
          - { mautic: '^7.0', php: '8.2' }
          - { mautic: '^7.2', php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.mautic }}-${{ hashFiles('composer.json') }}
      - name: Install Mautic ${{ matrix.mautic }} as a dev dependency
        run: |
          composer require --no-update --no-interaction "mautic/core-lib:${{ matrix.mautic }}"
          composer update --no-interaction --no-progress
          composer show mautic/core-lib | grep versions
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  integration:
    name: Install in Mautic ${{ matrix.mautic }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # official images (mautic/mautic); Mautic 7 needs MySQL 8.4
          - { mautic: '5.0.4-apache', mysql: 'mysql:8.0' }
          - { mautic: '5-apache', mysql: 'mysql:8.0' }
          - { mautic: '6-apache', mysql: 'mysql:8.0' }
          - { mautic: '7.0-apache', mysql: 'mysql:8.4' }
          - { mautic: '7-apache', mysql: 'mysql:8.4' }
    steps:
      - uses: actions/checkout@v4
      - name: Install Mautic, add the plugin, reload plugins and run the smoke test
        run: bash .github/scripts/integration.sh '${{ matrix.mautic }}' '${{ matrix.mysql }}'
