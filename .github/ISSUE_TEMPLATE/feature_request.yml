name: Feature request
description: Suggest an improvement to the plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the plugin could solve it.
    validations:
      required: true
  - type: input
    id: mautic-version
    attributes:
      label: Mautic version you use
      placeholder: 4.4.12
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
